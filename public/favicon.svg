<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1d24" />
      <stop offset="100%" stop-color="#0f1014" />
    </linearGradient>
    <!-- userSpaceOnUse: 身子/头/尾巴共用一条渐变 → 接缝看不出来, 像一整只鸟 -->
    <linearGradient id="bird" gradientUnits="userSpaceOnUse" x1="26" y1="8" x2="34" y2="58">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f0a12b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)" />

  <!-- 尾巴 (比身子还长, 越往梢越细) -->
  <path d="M20 34 C 12 43 6 53 3 61 C 8 57 15 49 23 42 Z" fill="url(#bird)" />
  <!-- 尾梢的白尖 (派亚鹃的标志) -->
  <path d="M3 61 C 4.4 57.6 6 54.4 7.8 51.4 C 6.4 55 5.2 58 4.6 60.6 Z" fill="#fde68a" opacity="0.85" />

  <!-- 身子 -->
  <ellipse cx="29" cy="31" rx="10.5" ry="8.8" transform="rotate(-30 29 31)" fill="url(#bird)" />

  <!-- 头 -->
  <circle cx="42" cy="18" r="7.6" fill="url(#bird)" />

  <!-- 喙 -->
  <path d="M48.5 16.6 Q 55 18.6 57.5 22.6 Q 52 21.6 47.6 19.6 Z" fill="#fbbf24" />

  <!-- 头顶的深色冠 -->
  <path d="M34.8 15.4 A 7.6 7.6 0 0 1 49.4 15.6 A 11.5 11.5 0 0 0 34.8 15.4 Z" fill="#7c3a0d" />

  <!-- 眼 (黄眼圈 + 黑瞳) -->
  <circle cx="44" cy="16.6" r="2.5" fill="#fbbf24" />
  <circle cx="44" cy="16.6" r="1.45" fill="#0f1014" />
</svg>
