; ESP32-S3 LED 外设固件
; 硬件: GPIO14 → WS2811/WS2812 灯带 DIN, 176 颗, GRB, 800kHz
; (灯带型号/数量/引脚与树莓派端 led_remote.py 的默认值保持一致)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 这块板子的实际 flash 是 8MB (esptool flash-id 报告 "Detected flash size: 16MB",
; 但 ROM bootloader 报 flash chip size 0x800000 = 8MB, 以 ROM 为准).
; 用 16MB 分区表会启动失败: "partition 3 invalid ... exceeds flash chip size".
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

; WebSocket server (WiFi 链路用).
; ★ Arduino-ESP32 3.x 自带的 libraries/ 里**没有** WebSockets/WebServer
;   (3.x 移掉了) —— 必须从 PlatformIO registry 拉.
;   这个包很小 (几十 KB), 实测下载 7 秒.
lib_deps =
    links2004/WebSockets@2.7.3

; 灯带驱动默认是自写的 **RMT 硬件后端** (src/ws2812_rmt.cpp):
;   * 波形由 RMT 外设按 10MHz tick 生成 (0.4/0.8µs), 不受 WiFi/BT 中断影响;
;   * 2026-11-11 真机用 RMT RX 回环验证: 0/1 高电平 = 32/64 tick (80MHz),
;     每个 bit 都精确相等; 同一块板子的 bit-bang 被无线中断拉到 234/431
;     tick (2.9/5.4µs), 0 bit 被读成 1 → 灯带乱闪、随机几颗亮.
;
; 另有几个可选 env:
;   esp32s3-bitbang   软件 bit-bang (对照/没有 RMT 的板子; 连网时不可靠)
;   esp32s3-rmt       跟默认 env 一样 (保留旧名字, 兼容脚本)
;   esp32s3-selftest  纯 LED 自检 (不初始化 BLE/WiFi), 上电亮第 1 黄 + 第 10 红
;   esp32s3-npbus     对照组: 开源 NeoPixelBus + NeoPixelBusIdf5Rmt

build_flags =
    -D LED_PIN=14
    -D LED_COUNT=176
    ; ★ WebSocket 链路 (WiFi + WS server) —— 前端走 ws://<esp32>:8080 连过来,
    ;   协议跟树莓派那边 (led_remote.py) 完全一致, 所以前端一行都不用改,
    ;   只把设置里的「灯带地址」改成 ESP32 的 IP 就行.
    -D LED_WS_PORT=8080
    ; ★ 物理灯数 —— 一帧实际推出去的颗数 (硬件上真实接了几颗).
    ;   352 = 两条灯带串联 (跟树莓派端 led-remote.service 的 --physical-count 352
    ;   一致). WS2811 是串联的: 链上接了 352 颗却只推 176 颗, 后面那截会
    ;   **保持上一帧的颜色** (残留鬼影). 所以推的颗数必须 = 物理颗数.
    ;   ⚠️ 只接了一条 176 颗的带的话, 把它改成 176 —— 每帧快一倍.
    -D LED_PHYSICAL_COUNT=352
    ; 亮度缩放系数 (0..255)。前端 LedController 已经在主机侧乘过 brightness,
    ; 树莓派端 rpi_ws281x 也是满亮度 (255) —— 这里保持 255, 与树莓派行为一致。
    -D LED_BRIGHTNESS=255
    ; 灯带驱动由 ble_led.h 里的 LED_DRIVER_RMT 选择 (不传 = 1 = RMT 硬件).
    ;
    ; ★ 灯数不是只有 176: ble_led.h 的 LED_ALLOWED_COUNTS 白名单 = (176, 352),
    ;   双色带 (两条灯带串联) 通过 BLE 的 led.init 切到 352 —— 不用重烧固件.
    ;   (那个 count 是**逻辑**灯数: 只决定"允许写哪几颗"; 一帧推多少颗永远是
    ;    上面的 LED_PHYSICAL_COUNT.)
    ;
    ; ★ 同时点亮的颗数上限 (led_limits.h 的 LED_MAX_LIT) **默认关** (=不限),
    ;   跟树莓派端 led_remote.py 一致 (那边根本没有这个限制). 以前写死 30 颗,
    ;   结果谱子一密就把**下标最大**的那批灯悄悄灭掉 —— 而双色带的上灯带
    ;   恰好是下标最大的 → 上灯带经常「自己灭一半」.
    ;   供电真的扛不住时再打开: -D LED_MAX_LIT=30 (30 颗 ≈ 1.8A).

; ---------------------------------------------------------------------------
; 可选: 软件 bit-bang 后端 (对照 / 没有 RMT 的板子)
; ---------------------------------------------------------------------------
; ⚠️ 连网时**不可靠**: bit-bang 靠关本核中断, 但挡不住 level 4+ 的
;    WiFi/BT 中断 —— 实测 0 bit 的高电平被拉到 234 tick (2.9µs), 会读成 1.
;    只在不连网的固件 (selftest) 里能保证波形. 留着是为了做对照实验.
[env:esp32s3-bitbang]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -D LED_DRIVER_RMT=0

; ---------------------------------------------------------------------------
; 可选: 自写 RMT 硬件驱动 (⚠️ 现在就是**默认**驱动, 这个 env 只是保留旧名字)
; ---------------------------------------------------------------------------
; 用 IDF 5 的新 RMT TX 驱动 + **bytes encoder** + DMA:
; 不预编码整帧 symbol (不占 33.8KB 堆), 负载就是像素字节; 352 颗线上 10.44ms.
; 编码器把 0/1 直接展开成「高 4/8 tick + 低 8/4 tick」, MSB first.
[env:esp32s3-rmt]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -D LED_DRIVER_RMT=1
    -D LED_RMT_DMA=1

; ---------------------------------------------------------------------------
; 纯 LED 自检 (不初始化 BLE, 不连前端)
; ---------------------------------------------------------------------------
; 上电: 全灭, 只开第 1 颗 = 黄色 + 第 10 颗 = 红色 (常亮). 串口 115200 可用命令:
;   first   全灭 + 第 1 颗黄 / 第 10 颗红
;   walk    0..5 逐颗点亮 (每颗 400ms), 串口打印下标 —— 查物理偏移
;   sweep   全条 0..175 逐颗点亮 (150ms/颗)
;   on/off/offall/status
;   count   换逻辑灯数 (176 / 352) —— 换完范围外的那截会抹黑
;
;   ⚠️ 串口测试命令要小心: 176 颗全亮 = 10.5A —— 板子/USB 直接被拉垮
;     (真机已经因此掉过一次线). 固件里的 LED_MAX_LIT 默认是 0 (不限,
;     跟树莓派一致) —— 自己测试时用 on30 (只点 30 颗) 就够了.
;
;   pio run -e esp32s3-selftest -t upload --upload-port COM5
[env:esp32s3-selftest]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -D LED_SELFTEST=1
    ; 自检固件不连 WiFi 也不开 WS server —— 只测灯带本身.
    -D LED_WS_ENABLE=0

; ---------------------------------------------------------------------------
; 说明: 试过"NeoPixelBus + NeoPixelBusIdf5Rmt"这条开源组合, 但在当前
; Arduino-ESP32 3.3.12 / IDF 5.5 上编不过 (NeoPixelBus 自带的
; NeoEsp32LcdXMethod.h 用了 IDF 已移除的 gpio_hal_iomux_func_sel). 所以
; 自检固件仍用仓库里的 bit-bang / RMT 驱动, 不引外部库.
; ---------------------------------------------------------------------------
